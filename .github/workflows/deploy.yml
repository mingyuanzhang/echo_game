# Builds the game and publishes dist/ to GitHub Pages on every push to main.
#
# Nothing here is specific to Pages beyond the last two steps: the site is plain static
# files with no server component, so the artifact is simply whatever `npm run build`
# leaves in dist/. `base: './'` in vite.config.ts is what lets those files work from the
# /echo_game/ subdirectory a project site is served from.
#
# ONE-TIME SETUP, done by hand: Settings -> Pages -> Build and deployment -> Source must
# be set to "GitHub Actions". The workflow cannot do this for itself — configure-pages
# can be asked to create the site with `enablement: true`, but GITHUB_TOKEN is not
# permitted to call the create-a-Pages-site endpoint and the run fails with "Resource not
# accessible by integration".
#
# It must be "GitHub Actions" and not "Deploy from a branch". The branch option does not
# error — it serves the repository verbatim, so the root index.html (the Vite dev entry,
# pointing at /src/main.tsx) is what the browser gets, no bundle is ever loaded, and the
# site is a blank page that returns 200.
name: Deploy

on:
  push:
    branches: [main]
  # So the site can be rebuilt from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run build` typechecks before bundling, so a type error fails the deploy
      # rather than shipping.
      - run: npm run build

      # The acceptance test: every room's optimum is re-derived and replayed through the
      # real reducer. Cheap enough to run on every deploy, and it is the one check that
      # would catch the physics or the scoring drifting.
      - run: npm run solve

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
